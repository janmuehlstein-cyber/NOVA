<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10110f"><meta name="description" content="NOVA PULSE – dein persönlicher Assistent für Alltag, Planung und Fortschritt.">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>NOVA PULSE</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#dashboard" aria-label="NOVA PULSE Startseite"><span class="brand-mark">N</span><span><b>NOVA</b><small>P U L S E</small></span></a>
    <div class="side-label">WORKSPACE</div>
    <nav class="nav" aria-label="Hauptnavigation">
      <button class="nav-item active" data-page="dashboard"><span>◫</span> Übersicht</button>
      <button class="nav-item" data-page="assistant"><span>✳</span> Assistent</button>
      <button class="nav-item" data-page="messages"><span>↗</span> Nachrichten</button>
      <button class="nav-item" data-page="calendar"><span>▦</span> Kalender</button>
      <button class="nav-item" data-page="habits"><span>◉</span> Routinen</button>
      <button class="nav-item" data-page="finance"><span>⌁</span> Finanzen</button>
    </nav>
    <div class="sidebar-bottom"><div class="privacy-chip"><span class="live-dot"></span><span><b>Local-first</b><small>Deine Daten bleiben auf diesem Gerät.</small></span></div><button class="nav-item" data-page="settings"><span>⚙</span> Einstellungen</button><div class="version">NOVA PULSE <span>v1.2.0</span></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="mobile-brand"><span class="brand-mark">N</span><b>NOVA <i>PULSE</i></b></div><div class="top-context"><span class="live-dot"></span> PERSONAL SPACE <span class="top-divider">/</span> <span id="top-date">HEUTE</span></div><div class="top-actions"><button class="icon-btn" id="quick-add" title="Neuer Termin">＋</button><button class="btn btn-ghost btn-small" id="global-theme-toggle" type="button" title="Darstellung wechseln">☀ Hell</button><button class="avatar" data-page="settings" title="Einstellungen">J</button></div></header>
    <div class="content" id="app-content" aria-live="polite"></div>
    <footer class="mobile-nav"><button class="active" data-page="dashboard">⌂<small>Home</small></button><button data-page="assistant">✳<small>KI</small></button><button data-page="calendar">▦<small>Plan</small></button><button data-page="habits">◉<small>Goals</small></button><button data-page="finance">⌁<small>Money</small></button></footer>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="event-dialog" class="modal"><form id="event-form"><div class="modal-head"><div><span class="eyebrow">KALENDER</span><h2 id="event-dialog-title">Neuer Termin</h2></div><button class="icon-btn" type="button" data-close="event-dialog">×</button></div><input type="hidden" name="eventId"><label>Titel<input name="title" required maxlength="80" placeholder="z. B. Training"></label><div class="form-grid"><label>Datum<input name="date" type="date" required></label><label id="event-time-label">Uhrzeit<input name="time" type="time" value="17:00" required></label></div><label class="all-day-toggle"><input name="allDay" type="checkbox"> Ganztägiger Termin</label><label>Ort (optional)<input name="location" maxlength="100" placeholder="Wo findet es statt?"></label><label>Notiz (optional)<textarea name="note" rows="2" maxlength="300" placeholder="Weitere Informationen …"></textarea></label><div class="modal-actions"><button class="btn btn-ghost" type="button" data-close="event-dialog">Abbrechen</button><button class="btn btn-primary" type="submit">Termin speichern</button></div><p class="fine-print">Der Termin wird erst nach Klick auf „Termin speichern“ lokal hinzugefügt.</p></form></dialog>
<script src="app.js"></script>
</body></html>
